name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'pnpm'
          # build failing from above ^

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Type Check
        run: pnpm exec tsc --noEmit

      - name: Build Next.js Application
        run: pnpm run build
        env:
          DATABASE_URL: postgres://dummy:dummy@localhost:5432/consumer_lens
          AUTH_SECRET: ci_build_auth_secret_must_be_sufficiently_long_for_jose_jwt_verification
          GEMINI_API_KEY: dummy_key_for_build
